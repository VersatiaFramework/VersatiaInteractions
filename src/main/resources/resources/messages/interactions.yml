# Arguments: {target} the other player, {sender} who sends or sent the offer, {action} the action's
# bare name (written after a colon), {action.id} its id, {seconds} the seconds left, {reason} a whole
# sentence from the action's plugin. For one action, its plugin's interaction.button.<state>.name and
# .lore and interaction.offer.<event> replace these.
window:
  title: "{target}"
button:
  available:
    name: "<neutral>Offer: {action}"
    lore:
      - "<hint>Click to send the offer to {target}."
  waiting:
    name: "<neutral>Waiting for {target}: {seconds} s"
    lore:
      - "<hint>Click to withdraw the offer."
  offered:
    name: "<positive>Accept: {action}"
    lore:
      - "<hint>{target} is waiting for your answer: {seconds} s."
      - "<hint>Click to accept."
  busy:
    name: "<warning>Unavailable: {action}"
    lore:
      - "{reason}"
  denied:
    name: "<negative>Unavailable: {action}"
    lore:
      - "{reason}"
  active:
    name: "<neutral>In progress: {action}"
offer:
  sent: "<neutral>Waiting for {target} to answer: {action}."
  # The buttons run /interact, a command that needs the CommandAPI plugin
  received: "<neutral>{sender} offers you: {action}. <click:run_command:'/interact accept {sender.name} {action.id}'>[Accept]</click> <click:run_command:'/interact decline {sender.name} {action.id}'>[Decline]</click>"
  accepted: "<positive>{target} accepted: {action}."
  declined: "<negative>{target} declined: {action}."
  expired: "<warning>{target} did not answer in time: {action}."
  cancelled: "<warning>The offer to {target} was cancelled: {action}."
too-far: "<negative>{target} is too far away."
# The reason on a busy button when the action's plugin has no interaction.busy or interaction.busy-self;
# here {target} is the busy player and {action} what keeps them busy
busy: "<warning>{target} is busy: {action}"
busy-self: "<warning>You are busy: {action}"
# When another plugin stops an offer without giving a reason
unavailable: "<negative>This is not possible now."
# receiver.notify: dialog or both
dialog:
  title: "<heading>Offer: {action}"
  body: "<neutral>{sender} offers you: {action}."
  accept: "<positive>Accept"
  decline: "<negative>Decline"
command:
  no-offer: "<negative>{target} has no offer waiting for your answer."
  choose: "<warning>{target} is waiting for several answers; click the one you mean in chat or in the menu."
